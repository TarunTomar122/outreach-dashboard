  .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .controls input, .controls select { padding: 8px 12px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-size: 0.85rem; }
  .controls input { flex: 1; min-width: 200px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #1e293b; }
  th { background: #1e293b; color: #94a3b8; font-weight: 600; position: sticky; top: 0; cursor: pointer; user-select: none; }
  th:hover { color: #e2e8f0; }
  tr:hover { background: #1e293b; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .notes { color: #94a3b8; font-size: 0.8rem; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: #64748b; font-size: 0.75rem; }
  .campaign { display: none; }
  .campaign.active { display: block; }
  .clear-btn { padding: 8px 12px; border: 1px solid #ef4444; border-radius: 8px; background: transparent; color: #ef4444; cursor: pointer; font-size: 0.85rem; }
  .clear-btn:hover { background: #ef4444; color: white; }
  .empty { text-align: center; padding: 40px; color: #64748b; }

const STATUS_COLORS = {
  "replied": "#22c55e", "declined": "#ef4444", "followed_up": "#f59e0b",
  "sent": "#3b82f6", "email_sent": "#3b82f6", "no_reply": "#6b7280",
  "accepted": "#10b981", "in_thread": "#8b5cf6"
};

function statusBadge(s) {
  const c = STATUS_COLORS[s] || "#6b7280";
  return `<span class="badge" style="background:${c}22;color:${c};border:1px solid ${c}44">${s}</span>`;
}

function summaryCards(contacts) {
  const total = contacts.length;
  const replied = contacts.filter(c => c.status === "replied").length;
  const sent = contacts.filter(c => ["sent", "email_sent", "followed_up"].includes(c.status)).length;
  const declined = contacts.filter(c => c.status === "declined").length;
  return `
    <div class="summary">
      <div class="stat-card total"><div class="num">${total}</div><div class="label">Total</div></div>
      <div class="stat-card replied"><div class="num">${replied}</div><div class="label">Replied</div></div>
      <div class="stat-card sent"><div class="num">${sent}</div><div class="label">Active</div></div>
      <div class="stat-card declined"><div class="num">${declined}</div><div class="label">Declined</div></div>
    </div>`;
}

function renderTable(contacts) {
  const hasStatus = contacts.some(c => c.status && c.status !== "sent");
  const hasDate = contacts.some(c => c.date);
  const hasNotes = contacts.some(c => c.notes);
  const hasMeta = contacts.some(c => c.meta);
  const hasHandle = contacts.some(c => c.handle);
  const hasPlatform = contacts.some(c => c.platform);
  
  let html = `<table><thead><tr>
    <th onclick="sortTable(this,0)">Name ↕</th>
    <th onclick="sortTable(this,1)">Email ↕</th>`;
  if (hasHandle) html += `<th>Handle</th>`;
  if (hasPlatform) html += `<th>Platform</th>`;
  if (hasStatus) html += `<th onclick="sortTable(this,${hasHandle?2:hasPlatform?2:2})">Status ↕</th>`;
  if (hasDate) html += `<th onclick="sortTable(this,${...})">Date ↕</th>`;
  if (hasMeta) html += `<th>Meta</th>`;
  if (hasNotes) html += `<th>Notes</th>`;
  html += `</tr></thead><tbody>`;
  
  contacts.forEach(c => {
    html += `<tr>
      <td><strong>${c.name}</strong></td>
      <td>${c.email ? `<a href="mailto:${c.email}" style="color:#60a5fa">${c.email}</a>` : '-'}</td>`;
    if (hasHandle) html += `<td class="meta">${c.handle || '-'}</td>`;
    if (hasPlatform) html += `<td class="meta">${c.platform || '-'}</td>`;
    if (hasStatus) html += `<td>${statusBadge(c.status)}</td>`;
    if (hasDate) html += `<td class="meta">${c.date || '-'}</td>`;
    if (hasMeta) html += `<td class="meta">${c.meta || ''}</td>`;
    if (hasNotes) html += `<td class="notes" title="${c.notes.replace(/"/g,'&quot;')}">${c.notes || ''}</td>`;
    html += `</tr>`;
  });
  
  html += `</tbody></table>`;
  return html;
}

function renderCampaign(camp) {
  let filtered = [...camp.contacts];
  const f = filters[camp.id];
  if (f) {
    if (f.search) {
      const s = f.search.toLowerCase();
      filtered = filtered.filter(c => c.name.toLowerCase().includes(s) || c.email.toLowerCase().includes(s) || c.notes.toLowerCase().includes(s));
    }
    if (f.status) {
      filtered = filtered.filter(c => c.status === f.status);
    }
  }
  
  let html = summaryCards(filtered);
  
  // Status filter buttons
  const statuses = [...new Set(camp.contacts.map(c => c.status))].filter(Boolean);
  html += `<div class="controls">`;
  html += `<input type="text" placeholder="Search name, email, notes..." id="search-${camp.id}" oninput="setFilter('${camp.id}','search',this.value)">`;
  if (statuses.length > 0) {
    html += `<select id="status-${camp.id}" onchange="setFilter('${camp.id}','status',this.value)">
      <option value="">All statuses</option>
      ${statuses.map(s => `<option value="${s}">${s}</option>`).join('')}
    </select>`;
  }
  html += `<button class="clear-btn" onclick="clearFilters('${camp.id}')">Clear</button>`;
  html += `</div>`;
  
  html += `<div style="overflow-x:auto">${renderTable(filtered)}</div>`;
  if (filtered.length === 0) html = `<div class="empty">No contacts match your filters</div>`;
  return html;
}

const filters = {};
let activeCampaign = null;

function setFilter(id, key, value) {
  if (!filters[id]) filters[id] = { search: '', status: '' };
  filters[id][key] = value;
  if (activeCampaign === id) {
    const camp = CAMPAIGNS.find(c => c.id === id);
    document.getElementById('camp-' + id).innerHTML = renderCampaign(camp);
  }
}

function clearFilters(id) {
  delete filters[id];
  const searchEl = document.getElementById('search-' + id);
  const statusEl = document.getElementById('status-' + id);
  if (searchEl) searchEl.value = '';
  if (statusEl) statusEl.value = '';
  if (activeCampaign === id) {
    const camp = CAMPAIGNS.find(c => c.id === id);
    document.getElementById('camp-' + id).innerHTML = renderCampaign(camp);
  }
}

function switchCampaign(id) {
  activeCampaign = id;
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.querySelectorAll('.campaign').forEach(d => d.classList.toggle('active', d.id === 'camp-' + id));
}

function sortTable(th, col) {
  const table = th.closest('table');
  const tbody = table.querySelector('tbody');
  const rows = [...tbody.querySelectorAll('tr')];
  const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
  th.dataset.dir = dir;
  
  rows.sort((a, b) => {
    const va = a.cells[col]?.textContent.trim().toLowerCase() || '';
    const vb = b.cells[col]?.textContent.trim().toLowerCase() || '';
    return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  
  rows.forEach(r => tbody.appendChild(r));
}

function init() {
  const nav = document.getElementById('nav');
  const content = document.getElementById('content');
  
  CAMPAIGNS.forEach((camp, i) => {
    const btn = document.createElement('button');
    btn.textContent = `${camp.emoji} ${camp.label} (${camp.contacts.length})`;
    btn.dataset.id = camp.id;
    btn.onclick = () => switchCampaign(camp.id);
    if (i === 0) btn.classList.add('active');
    nav.appendChild(btn);
    
    const div = document.createElement('div');
    div.id = 'camp-' + camp.id;
    div.className = 'campaign' + (i === 0 ? ' active' : '');
    div.innerHTML = renderCampaign(camp);
    content.appendChild(div);
  });
  
  activeCampaign = CAMPAIGNS[0].id;
}

init();
